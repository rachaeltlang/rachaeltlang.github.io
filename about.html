<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header id="header"></header>

    <div class="container">
        <h1 class="about-text">Hi! Nice to meet you!</h1>
        <p class="about-text">This page will be about me.</p>
    </div>

    <footer id="footer"></footer>

    <!-- script to load header and footer using fetch -->
    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>

</body>
