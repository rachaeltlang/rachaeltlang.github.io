<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <link rel="stylesheet" type="text/css" href="styles.css">

    <script>
        // load header and footer using fetch
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>

<body>

    <div class="container">
        <h1>Hi! Nice to meet you!</h1>
        <p>In 2023, I graduated from the <a href="https://www.wisc.edu/
            ">University of Wisconsin - Madison</a> with a Bachelor's of Science in <a href="https://www.cs.wisc.edu/
            ">Computer Science</a>, along with minors in <a href="https://stat.wisc.edu/data-science-certificate/">Data
                Science</a> and <a href="https://chicla.wisc.edu/
            ">Chicano and Latino Studies</a>. Check out what
            the Department of Computer Sciences <a href="https://www.cs.wisc.edu/2023/12/21/computer-sciences-celebrates-december-graduates/
            ">wrote</a> about me!

    </div>

    <!-- script to load header and footer using fetch -->
    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>
    <footer id="footer"></footer>
</body>
