<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">

    <title>郎宗婷</title>

    <meta name="description" content="Rachael Lang's personal website created using HTML and CSS" />
    <meta name="author" content="Rachael Lang">
    <meta name="keywords" content="software engineer, computer science, personal website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" />

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/assets/lang.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/favicon.ico" />

    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Franklin">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Outfit">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Shantell+Sans">

    <!-- font awesome icons (for footer) -->
    <script src="https://kit.fontawesome.com/a7ff71eb5b.js" crossorigin="anonymous"></script>

    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script>
        // load header and footer using fetch
        fetch("/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>

    <!-- to toggle between languages -->
    <script src="/js/lang-toggle.js" defer></script>
</head>

<body>
    <header id="header"></header>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="page-container" id="root">
        <div class="content-container">
            <div class="text-container">
                <h1 style="font-size: 60px; font-family: 'Shantell Sans';" class="name">
                    郎宗婷
                </h1>
                <p>嗨，很高興你來到這裡！點擊各個頁面來更了解我和我的工作吧</p>
                <a style="color:white" href="about.html" class="btn btn-primary">走吧！</a>
            </div>
            <div class="text-container">
                <img style="width: 100%; max-width: 300px; min-width: 150px; height: auto; border-radius: 50%;"
                    src="/assets/images/rachael-new.jpg" class="main-img" alt="picture of Rachael Lang" />
            </div>
        </div>
    </div>
    <footer id="footer"></footer>
</body>

</html>
