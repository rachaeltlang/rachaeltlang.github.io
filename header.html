<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/favicon.ico" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin&family=Outfit&family=Shantell+Sans&display=swap"
        rel="stylesheet" />

    <!-- to toggle between languages -->
    <script src="/js/lang-toggle.js" defer></script>
</head>

<body>
    <header class="header">
        <!-- navigate to home when user clicks on logo or website title -->
        <div class="logo">
            <a href="/"> <img src="/assets/favicon.ico" alt="croissant favicon" class="image" href="/"
                    style="width:36px;height:36px;" /></a>
            <a class="header-title" href="/">Rachael Lang</a>
        </div>

        <div>
            <nav class="header-list">
                <ul>
                    <a class="header-tab" href="about.html">About</a>
                    <a class="header-tab" href="experience.html">Experience</a>
                    <a class="header-tab" href="projects.html">Projects</a>
                    <a class="header-tab" href="/blog.html">Blog</a>
                    <a class="header-tab" href="assets/RachaelLangResume.pdf" target="_blank"
                        alt="Rachael Lang's Resume" aria-label="Download Rachael's Resume">Resume</a>

                    <!-- language globe icon and dropdown list -->
                    <li class="dropdown">
                        <a href="#" class="header-tab" aria-label="Toggle language"><i class="fa-solid fa-globe"></i></a>
                        <ul class="dropdown-content">
                            <li><a onclick="switchLanguage('en')">English</a></li>
                            <li><a onclick="switchLanguage('zh')">繁體中文</a></li>
                            <li><a onclick="switchLanguage('es')">español</a></li>
                        </ul>
                    </li>

                    <!-- light/dark mode toggle --> 
                    <a href="#" id="themeToggle" class="header-tab" aria-label="Change to dark theme">
                        <i class="fa-solid fa-moon"></i>
                    </a>
                </ul>
            </nav>
        </div>
    </header>
</body>

</html>
