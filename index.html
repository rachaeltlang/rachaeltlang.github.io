<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Rachael Lang</title>

    <meta name="description" content="Rachael Lang's personal website created using HTML and CSS" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" />

    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/favicon.ico" />

    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin&family=Outfit&family=Shantell+Sans&display=swap"
        rel="stylesheet" />

    <!-- font awesome icons (for footer) -->
    <script src="https://kit.fontawesome.com/a7ff71eb5b.js" crossorigin="anonymous"></script>

    <script>
        // redirect to the homepage
        function redirectToHomepage() {
            window.location.href = "/";
        }

        // check if the page is not the homepage (optional)
        if (window.location.pathname !== '/') {
            // if it's not the homepage, redirect to the homepage
            redirectToHomepage();
        }

        // load header and footer using fetch
        fetch("/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>

    <!-- to toggle between languages -->
    <script src="/js/lang-toggle.js" defer></script>
</head>

<body>
    <header id="header"></header>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div class="content-container">
        <div class="page-container" id="root">
            <div class="homepage-container">
                <div class="text-container">
                    <!-- <h1 style="font-size: 60px; font-family: 'Shantell Sans';" class="name"> Rachael Lang </h1> -->
                    <h1>Hi, I'm Rachael, a software developer with a front-end focus. I love transforming complex
                        systems into intuitive, human-centered experiences.</h1>
                    <p style="font-size: 20px">I’m glad you’re here! Click around to learn more about me and my work.
                    </p>
                    <a style="color:white" href="/about.html" class="btn btn-primary" aria-label="Navigate to About page">Let’s Go!</a>
                </div>
                <div class="text-container">
                    <img style="width: 100%; max-width: 800px; min-width: 300px; height: auto; border-radius: 50%;"
                        src="/assets/images/rachael-new.jpg" class="main-img" alt="picture of Rachael Lang" />
                </div>
            </div>
        </div>
    </div>
    <footer id="footer"></footer>
</body>

</html>
