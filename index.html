<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <title>Rachael Lang</title>

    <meta name="description" content="Rachael Lang's personal website created using HTML and CSS" />
    <meta name="author" content="Rachael Lang">
    <meta name="keywords" content="software engineer, computer science, personal website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" />

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/favicon.ico" />

    <script src="https://kit.fontawesome.com/a7ff71eb5b.js" crossorigin="anonymous"></script>

    <script>
        // redirect to the homepage
        function redirectToHomepage() {
            window.location.href = "/";
        }

        // Check if the page is not the homepage (optional)
        if (window.location.pathname !== '/') {
            // If it's not the homepage, redirect to the homepage
            redirectToHomepage();
        }
    
        // load header and footer using fetch
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>
</head>

<header id="header"></header>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
        <div class="home-container">
            <div class="content-container centered-content">
                <div class="text-container">
                    <h1 class="h1-style">Rachael Lang</h1>
                    <p class="p-style">Hi! I'm Rachael</p>

                </div>
                <div class="image-container">
                    <img style="width: 300px; height: 300px;" src="assets/images/rachael.jpg"
                        alt="picture of Rachael Lang" />
                </div>
            </div>
        </div>
    </div>

</body>

<footer id="footer"></footer>



</html>
