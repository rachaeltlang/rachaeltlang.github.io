<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">

    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"

    <script>
        // load header and footer using fetch
        fetch("/header.html")

                document.getElementById("header").innerHTML = data;
            });

            .then(response => response.text())
            .then(data => {

            });

        <iframe class="airtable-embed"
            src="https://airtable.com/embed/appFpxsh7GHEtiDls/shrP4gYr4PVuTxBzE?viewControls=on" frameborder="0"
            onmousewheel="" width="100%" height="533" style="background: transparent; border: 1px solid #ccc;"></iframe>
    </div>
